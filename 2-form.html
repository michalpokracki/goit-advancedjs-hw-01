<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/goit-advancedjs-hw-01/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-01/2-form.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-advancedjs-hw-01/assets/styles-BpCeszFg.js">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-01/assets/styles-BJoNB1cz.css">
  </head>
  <body>
    <form class="feedback-form" autocomplete="off">
      <label class="form-label">
        Email
        <input
          class="form-input email-input"
          type="email"
          name="email"
          autofocus
        />
      </label>
      <label class="form-label">
        Message
        <textarea
          class="form-input message-input"
          name="message"
          rows="8"
        ></textarea>
      </label>
      <button class="form-button" type="submit">Submit</button>
    </form>

  </body>
</html>
